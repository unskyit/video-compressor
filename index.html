<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unskyit Pro Compressor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <style>
        :root {
            --bg-color: #eff6ff; 
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb; 
            --primary-hover: #1d4ed8;
            --border-color: #bfdbfe;
            --danger: #ef4444;
            --success: #10b981;
            --trust-bg: #dbeafe;
            --trust-text: #1e3a8a;
            --console-bg: #0f172a;
            --console-text: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1);
            --radius: 20px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6; 
            --primary-hover: #60a5fa;
            --border-color: #334155;
            --trust-bg: rgba(37, 99, 235, 0.15);
            --trust-text: #93c5fd;
            --console-bg: #000000;
            --console-text: #4ade80;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: "Lexend", sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        h1 { font-size: 1.8rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 12px; }
        button.icon-btn {
            background: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-main); cursor: pointer; padding: 12px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s;
        }
        button.icon-btn:hover { transform: scale(1.1) rotate(15deg); border-color: var(--primary); color: var(--primary); }

        .card { background: var(--surface-color); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.1); }
        
        .trust-banner { background-color: var(--trust-bg); color: var(--trust-text); padding: 16px; border-radius: 16px; font-size: 0.95rem; font-weight: 500; text-align: center; }

        .upload-zone { border: 2px dashed var(--border-color); border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 16px; background-color: rgba(37, 99, 235, 0.02); width: 100%; }
        .upload-zone:hover { border-color: var(--primary); background-color: rgba(37, 99, 235, 0.08); }
        .upload-emoji { font-size: 3rem; animation: bounce 2.5s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } 60% { transform: translateY(-6px); } }
        
        input[type="file"] { 
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }

        .file-queue { margin-top: 20px; display: none; flex-direction: column; gap: 10px; max-height: 180px; overflow-y: auto; padding-right: 5px; }
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.9rem; font-weight: 500; }
        .status { font-weight: 700; font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; background: var(--surface-color); }
        .status-pending { color: var(--text-muted); } .status-processing { color: var(--primary); animation: pulse 1.5s infinite; } .status-done { color: var(--success); } .status-error { color: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; display: none; }
        .form-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        label.setting-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; z-index: 2; }
        
        /* Hide original selects */
        select { display: none; }
        
        input[type="number"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-main); font-size: 0.95rem; font-weight: 500; outline: none; transition: border-color 0.2s; }
        input[type="number"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

        /* --- CUSTOM DROP-DOWN CSS --- */
        .custom-select-wrapper { position: relative; width: 100%; }
        .custom-select { position: relative; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 40px 14px 14px; font-size: 0.95rem; font-weight: 500; cursor: pointer; color: var(--text-main); transition: border-color 0.2s, box-shadow 0.2s; user-select: none; }
        .custom-select::after { content: '▼'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--text-muted); pointer-events: none; }
        .custom-select.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        
        .custom-select-options { position: absolute; top: 100%; left: 0; right: 0; background-color: var(--surface-color); border: 1px solid var(--border-color); border-top: none; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 99; max-height: 200px; overflow-y: auto; display: none; flex-direction: column; }
        .custom-select-options.show { display: flex; animation: slideDown 0.2s ease-out; }
        .custom-option { padding: 12px 14px; font-size: 0.9rem; cursor: pointer; border-bottom: 1px solid var(--border-color); transition: background-color 0.2s; }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background-color: var(--trust-bg); color: var(--primary); }
        .custom-option.selected { background-color: rgba(37, 99, 235, 0.05); font-weight: 700; color: var(--primary); border-left: 3px solid var(--primary); }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        /* -------------------------- */

        .primary-btn { background-color: var(--primary); color: white; border: none; border-radius: 16px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 25px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s, background-color 0.2s; }
        .primary-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .primary-btn.danger-btn { background-color: var(--danger); } .primary-btn.danger-btn:hover { background-color: #dc2626; }
        .primary-btn.outline-btn { background-color: transparent; color: var(--text-main); border: 2px solid var(--border-color); } .primary-btn.outline-btn:hover { border-color: var(--primary); color: var(--primary); }

        .dashboard { display: none; margin-top: 25px; }
        .progress-bar-container { width: 100%; height: 16px; background-color: var(--border-color); border-radius: 99px; overflow: hidden; margin: 15px 0; }
        .progress-bar { height: 100%; width: 0%; background-color: var(--primary); border-radius: 99px; transition: width 0.3s ease; }
        .progress-bar.engine-bar { background-color: #a855f7; } 
        
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .metric-card { background-color: var(--bg-color); padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; }
        .metric-label { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .metric-value { font-weight: 700; font-size: 1.1rem; color: var(--primary); }

        .console-container { margin-top: 20px; border-radius: 12px; overflow: hidden; display: none; }
        .console-header { background: var(--border-color); padding: 10px 15px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .console-body { background: var(--console-bg); color: var(--console-text); padding: 15px; font-family: monospace; font-size: 0.8rem; height: 150px; overflow-y: auto; display: none; white-space: pre-wrap; line-height: 1.4; }

        .result-panel { display: none; text-align: center; margin-top: 25px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--surface-color); padding: 30px; border-radius: var(--radius); max-width: 350px; width: 90%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }

        @media (max-width: 360px) {
            body { padding: 10px; }
            .container { gap: 10px; }
            .card { padding: 15px; }
            h1 { font-size: 1.4rem; }
            .upload-zone { padding: 25px 15px; }
            .upload-emoji { font-size: 2.2rem; }
            .settings-grid, .metrics-grid { grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
            input[type="number"], .primary-btn { padding: 12px; font-size: 0.9rem; }
            .custom-select { padding: 12px 35px 12px 12px; font-size: 0.85rem; }
            .metric-card { padding: 10px; }
            .metric-value { font-size: 1rem; }
            label.setting-label { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Unskyit Pro</h1>
        <button class="icon-btn" id="themeToggle" title="Toggle Dark Mode">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </header>

    <div class="trust-banner">🔒 100% Private. Processed entirely on your device.</div>

    <div class="card" id="mainCard">
        <label class="upload-zone" id="uploadZone">
            <div class="upload-emoji">🎬</div>
            <h2 id="fileNameDisplay" style="font-weight: 700; font-size: 1.3rem;">Drop Video(s) Here</h2>
            <p id="fileSubtext" style="color: var(--text-muted); font-size: 0.9rem;">Tap to select one or multiple files</p>
            <input type="file" id="fileInput" accept="video/*,.mp4,.mov,.webm,.mkv" multiple>
        </label>

        <div class="file-queue" id="fileQueueUI"></div>

        <div class="settings-grid" id="settingsGrid">
            <div class="form-group">
                <label class="setting-label">Processing Speed / Quality</label>
                <select id="presetSelect">
                    <option value="ultrafast|30">⚡ Super Fast (Lower Quality, Largest File)</option>
                    <option value="veryfast|28" selected>🚀 Fast (Good Balance, Recommended)</option>
                    <option value="fast|24">✨ Medium (Better Quality, Slower)</option>
                    <option value="medium|20">🐢 Slow (Best Quality, VERY Slow)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="setting-label">Video Format (Codec)</label>
                <select id="codecSelect">
                    <option value="h264">H.264 (.mp4) - Fast & Universal</option>
                    <option value="vp9">VP9 (.webm) - ⚠️ EXTREMELY SLOW</option>
                </select>
            </div>

            <div class="form-group">
                <label class="setting-label">Output Resolution</label>
                <select id="resolutionSelect">
                    <option value="original">Original Size</option>
                    <option value="1080">1080p (Max HD)</option>
                    <option value="720">720p (Fastest Web)</option>
                    <option value="480">480p (Tiny File)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="setting-label">Target Method</label>
                <select id="strategySelect">
                    <option value="preset">Use Preset Speed</option>
                    <option value="target">Force Target Size (MB)</option>
                </select>
            </div>

            <div class="form-group" id="targetSizeGroup" style="display: none; grid-column: 1 / -1;">
                <label class="setting-label">Exact Target Size per file (MB)</label>
                <input type="number" id="targetSizeInput" placeholder="e.g., 15" min="1">
            </div>
        </div>

        <button class="primary-btn" id="startBtn" style="display: none;">
            Start Compression
        </button>

        <div class="dashboard" id="dashboard">
            <h3 style="text-align: center; margin-bottom: 5px; font-size: 1.1rem;" id="statusText">Initializing...</h3>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;" id="batchStatusText">Please wait</p>
            
            <div id="engineDlWrapper" style="display: none;">
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 15px;">
                    <span style="color: var(--text-muted)">Downloading Engine...</span>
                    <span id="dlPctText" style="font-weight: bold; color: #a855f7;">0%</span>
                </div>
                <div class="progress-bar-container" style="height: 10px;">
                    <div class="progress-bar engine-bar" id="dlProgressBar"></div>
                </div>
            </div>

            <div id="processingWrapper" style="display: none;">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="metrics-grid">
                    <div class="metric-card"><div class="metric-label">Progress</div><div class="metric-value" id="progressPct">0.00%</div></div>
                    <div class="metric-card"><div class="metric-label">Time Left</div><div class="metric-value" id="etaDisplay">--</div></div>
                </div>
            </div>

            <div class="console-container" id="consoleContainer">
                <div class="console-header" onclick="toggleConsole()">
                    <span>🛠️ Engine Logs</span>
                    <span id="consoleToggleIcon">▼</span>
                </div>
                <div class="console-body" id="consoleBody"></div>
            </div>

            <button class="primary-btn danger-btn" id="cancelBtn" style="margin-top: 20px;">Stop Everything</button>
        </div>

        <div class="result-panel" id="resultPanel">
            <div style="font-size: 3.5rem; animation: bounce 2s infinite;">✅</div>
            <h2 style="color: var(--success); margin: 15px 0 10px;">All Done!</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Files automatically saved to your device.</p>
            <button class="primary-btn outline-btn" id="resetBtn">Compress More</button>
        </div>
    </div>
</div>

<div class="modal" id="alertModal">
    <div class="modal-content">
        <div id="alertIcon" style="font-size: 3rem; margin-bottom: 10px;">🛑</div>
        <h2 id="alertTitle" style="margin-bottom: 10px; font-size: 1.3rem;">Notice</h2>
        <p id="alertMessage" style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Message</p>
        <button class="primary-btn" onclick="document.getElementById('alertModal').style.display='none'">Got it</button>
    </div>
</div>

<script>
    const themeToggle = document.getElementById('themeToggle');
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.addEventListener('click', () => {
        document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    function showCustomAlert(title, message, emoji = '🛑') {
        document.getElementById('alertTitle').textContent = title; document.getElementById('alertMessage').textContent = message;
        document.getElementById('alertIcon').textContent = emoji; document.getElementById('alertModal').style.display = 'flex';
    }

    const { FFmpeg } = window.FFmpegWASM; const { fetchFile } = window.FFmpegUtil;
    let ffmpeg = null; let isProcessing = false; let startTime = 0; let fileQueue = []; let currentBatchIndex = 0;

    const ui = {
        uploadZone: document.getElementById('uploadZone'), fileInput: document.getElementById('fileInput'),
        fileNameDisplay: document.getElementById('fileNameDisplay'), fileSubtext: document.getElementById('fileSubtext'),
        fileQueueUI: document.getElementById('fileQueueUI'), settingsGrid: document.getElementById('settingsGrid'),
        startBtn: document.getElementById('startBtn'), dashboard: document.getElementById('dashboard'), resultPanel: document.getElementById('resultPanel'),
        consoleBody: document.getElementById('consoleBody'), dlWrapper: document.getElementById('engineDlWrapper'), procWrapper: document.getElementById('processingWrapper'),
        strategySelect: document.getElementById('strategySelect')
    };

    // --- CUSTOM DROPDOWN ENGINE ---
    function setupCustomDropdowns() {
        document.querySelectorAll('select').forEach(select => {
            const wrapper = document.createElement('div');
            wrapper.className = 'custom-select-wrapper';
            
            const customSelect = document.createElement('div');
            customSelect.className = 'custom-select';
            customSelect.textContent = select.options[select.selectedIndex].text;
            
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'custom-select-options';
            
            Array.from(select.options).forEach((option, index) => {
                const optDiv = document.createElement('div');
                optDiv.className = `custom-option ${index === select.selectedIndex ? 'selected' : ''}`;
                optDiv.textContent = option.text;
                
                optDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    select.selectedIndex = index;
                    customSelect.textContent = option.text;
                    optionsContainer.querySelectorAll('.custom-option').forEach(el => el.classList.remove('selected'));
                    optDiv.classList.add('selected');
                    optionsContainer.classList.remove('show');
                    customSelect.classList.remove('active');
                    select.dispatchEvent(new Event('change')); // Trigger original listeners
                });
                optionsContainer.appendChild(optDiv);
            });
            
            customSelect.addEventListener('click', (e) => {
                e.stopPropagation();
                const isShowing = optionsContainer.classList.contains('show');
                document.querySelectorAll('.custom-select-options').forEach(el => el.classList.remove('show'));
                document.querySelectorAll('.custom-select').forEach(el => el.classList.remove('active'));
                if (!isShowing) {
                    optionsContainer.classList.add('show');
                    customSelect.classList.add('active');
                }
            });
            
            wrapper.appendChild(customSelect);
            wrapper.appendChild(optionsContainer);
            select.parentNode.insertBefore(wrapper, select.nextSibling);
        });

        // Close dropdowns if clicking anywhere else
        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-options').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.custom-select').forEach(el => el.classList.remove('active'));
        });
    }

    // Initialize custom dropdowns
    setupCustomDropdowns();

    // Logic for hiding/showing Target Size input based on the custom dropdown firing 'change'
    ui.strategySelect.addEventListener('change', (e) => { 
        document.getElementById('targetSizeGroup').style.display = e.target.value === 'target' ? 'flex' : 'none'; 
    });

    function toggleConsole() {
        const body = ui.consoleBody; const icon = document.getElementById('consoleToggleIcon');
        if(body.style.display === 'block') { body.style.display = 'none'; icon.textContent = '▼'; } 
        else { body.style.display = 'block'; icon.textContent = '▲'; body.scrollTop = body.scrollHeight; }
    }

    ui.uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); ui.uploadZone.style.borderColor = 'var(--primary)'; });
    ui.uploadZone.addEventListener('dragleave', () => ui.uploadZone.style.borderColor = 'var(--border-color)');
    ui.uploadZone.addEventListener('drop', (e) => { e.preventDefault(); ui.uploadZone.style.borderColor = 'var(--border-color)'; if(!isProcessing && e.dataTransfer.files.length) processSelectedFiles(e.dataTransfer.files); });
    
    ui.fileInput.addEventListener('change', (e) => { 
        if(e.target.files.length) processSelectedFiles(e.target.files); 
    });

    const getVideoDuration = (file) => new Promise((resolve) => {
        const video = document.createElement('video'); video.preload = 'metadata';
        video.onloadedmetadata = () => { resolve(video.duration); URL.revokeObjectURL(video.src); };
        video.onerror = () => resolve(1); video.src = URL.createObjectURL(file);
    });

    async function processSelectedFiles(files) {
        for (let i = 0; i < files.length; i++) {
            if (!files[i].type.startsWith('video/')) continue;
            if (files[i].size > 2040109465) { showCustomAlert("Ignored", "A file was over 1.9GB and was excluded.", "🐳"); continue; }
            fileQueue.push({ file: files[i], duration: await getVideoDuration(files[i]), status: 'pending', id: Math.random().toString(36).substr(2, 9) });
        }
        
        if (fileQueue.length > 0) {
            ui.uploadZone.style.display = 'none'; ui.settingsGrid.style.display = 'grid'; ui.startBtn.style.display = 'flex';
            
            if(fileQueue.length === 1) {
                ui.startBtn.textContent = `Compress 1 Video`;
                document.getElementById('batchStatusText').style.display = 'none';
            } else {
                ui.startBtn.textContent = `Start Batch Compression (${fileQueue.length})`;
                document.getElementById('batchStatusText').style.display = 'block';
                ui.fileQueueUI.style.display = 'flex';
                renderQueueUI();
            }
        }
    }

    function renderQueueUI() {
        ui.fileQueueUI.innerHTML = '';
        fileQueue.forEach((item, index) => {
            const el = document.createElement('div'); el.className = 'queue-item';
            let statusText = "Pending"; if(item.status === 'processing') statusText = "Processing..."; if(item.status === 'done') statusText = "Done"; if(item.status === 'error') statusText = "Failed";
            el.innerHTML = `<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%;">${index + 1}. ${item.file.name}</span><span class="status status-${item.status}">${statusText}</span>`;
            ui.fileQueueUI.appendChild(el);
        });
    }

    async function fetchWithProgress(url, type, updateFn) {
        const response = await fetch(url);
        // BUG FIX: Hardcoded uncompressed size for the specific .wasm file to prevent the 315% overflow
        const total = url.includes('wasm') ? 31457280 : parseInt(response.headers.get('content-length'), 10);
        let loaded = 0; const reader = response.body.getReader(); const chunks = [];
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value); loaded += value.length;
            if (total) updateFn(loaded / total);
        }
        return URL.createObjectURL(new Blob(chunks, { type: type }));
    }

    async function initFFmpeg() {
        if (ffmpeg && ffmpeg.loaded) return;
        ffmpeg = new FFmpeg();
        ffmpeg.on('progress', updateTelemetry);
        
        document.getElementById('consoleContainer').style.display = 'block';
        ffmpeg.on('log', ({ message }) => { 
            ui.consoleBody.textContent += message + '\n'; 
            ui.consoleBody.scrollTop = ui.consoleBody.scrollHeight; 
        });

        ui.dlWrapper.style.display = 'block';
        ui.procWrapper.style.display = 'none';

        // BUG FIX: Switched to unpkg to prevent jsDelivr Worker Redirects
        const coreBase = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
        const umdBase = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';

        document.getElementById('statusText').textContent = "Downloading WASM Engine...";
        
        const wasmBlob = await fetchWithProgress(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm', (p) => {
            const pct = Math.min((p * 100), 100).toFixed(0);
            document.getElementById('dlProgressBar').style.width = `${pct}%`;
            document.getElementById('dlPctText').textContent = `${pct}%`;
        });

        const coreBlob = await fetchWithProgress(`${coreBase}/ffmpeg-core.js`, 'text/javascript', ()=>{});
        const workerBlob = await fetchWithProgress(`${umdBase}/814.ffmpeg.js`, 'text/javascript', ()=>{});

        await ffmpeg.load({ coreURL: coreBlob, wasmURL: wasmBlob, classWorkerURL: workerBlob });
        
        ui.dlWrapper.style.display = 'none';
        ui.procWrapper.style.display = 'block';
    }

    ui.startBtn.addEventListener('click', async () => {
        isProcessing = true; 
        ui.fileInput.disabled = true; 
        ui.settingsGrid.style.display = 'none'; ui.startBtn.style.display = 'none'; ui.dashboard.style.display = 'block';
        
        try {
            await initFFmpeg();
            for (let i = currentBatchIndex; i < fileQueue.length; i++) {
                if(!isProcessing) break;
                currentBatchIndex = i; const currentItem = fileQueue[i];
                if(fileQueue.length > 1) { currentItem.status = 'processing'; renderQueueUI(); }
                
                document.getElementById('statusText').textContent = fileQueue.length > 1 ? "Processing Batch..." : "Compressing Video...";
                document.getElementById('batchStatusText').textContent = fileQueue.length > 1 ? `File ${i + 1} of ${fileQueue.length}: ${currentItem.file.name}` : currentItem.file.name;
                
                try {
                    await processSingleVideo(currentItem);
                    if(fileQueue.length > 1) { currentItem.status = 'done'; renderQueueUI(); }
                } catch (err) {
                    if (err.message === "terminated") throw err;
                    if(fileQueue.length > 1) { currentItem.status = 'error'; renderQueueUI(); }
                }
            }
            if(isProcessing) { ui.dashboard.style.display = 'none'; ui.resultPanel.style.display = 'block'; isProcessing = false; }
        } catch (error) { if(error.message !== "terminated") showCustomAlert("Engine Error", error.message, "⚠️"); }
    });

    async function processSingleVideo(queueItem) {
        startTime = Date.now(); document.getElementById('progressBar').style.width = '0%'; document.getElementById('progressPct').textContent = '0.00%';
        const file = queueItem.file; const inputName = 'in_' + Math.random().toString(36).substr(2, 4) + file.name.substring(file.name.lastIndexOf('.'));
        const codec = document.getElementById('codecSelect').value; const outputExt = codec === 'vp9' ? '.webm' : '.mp4';
        const outputName = 'out_' + Math.random().toString(36).substr(2, 4) + outputExt;

        await ffmpeg.writeFile(inputName, await fetchFile(file));
        let args = ['-i', inputName];

        args.push('-c:v', codec === 'vp9' ? 'libvpx-vp9' : 'libx264');
        args.push('-c:a', codec === 'vp9' ? 'libopus' : 'aac');
        if(codec === 'h264') args.push('-movflags', '+faststart'); 

        const res = document.getElementById('resolutionSelect').value;
        if (res !== 'original') args.push('-vf', `scale=-2:${res}`);

        if (document.getElementById('strategySelect').value === 'preset') {
            const [preset, crf] = document.getElementById('presetSelect').value.split('|');
            if(codec === 'h264') args.push('-preset', preset); 
            if(codec === 'vp9') args.push('-cpu-used', '5', '-deadline', 'realtime'); 
            args.push('-crf', crf);
        } else {
            const targetMB = parseFloat(document.getElementById('targetSizeInput').value);
            if (!targetMB || targetMB <= 0) throw new Error("Invalid target size.");
            const bitrateKbps = Math.floor((targetMB * 8192) / queueItem.duration);
            args.push('-b:v', `${bitrateKbps}k`, '-maxrate', `${bitrateKbps * 1.5}k`, '-bufsize', `${bitrateKbps * 2}k`);
            if(codec === 'h264') args.push('-preset', 'veryfast'); 
        }

        args.push(outputName);
        await ffmpeg.exec(args);

        const data = await ffmpeg.readFile(outputName);
        const blob = new Blob([data.buffer], { type: codec === 'vp9' ? 'video/webm' : 'video/mp4' });
        const downloadUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a'); a.href = downloadUrl; a.download = `unskyit_${file.name.substring(0, file.name.lastIndexOf('.'))}${outputExt}`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(downloadUrl);

        ffmpeg.deleteFile(inputName); ffmpeg.deleteFile(outputName);
    }

    function updateTelemetry({ progress }) {
        if (progress < 0 || progress > 1) return;
        const pct = (progress * 100).toFixed(1);
        document.getElementById('progressBar').style.width = `${pct}%`; document.getElementById('progressPct').textContent = `${pct}%`;
        const elapsedSec = (Date.now() - startTime) / 1000;
        if (progress > 0.02) document.getElementById('etaDisplay').textContent = formatTime(Math.max(0, (elapsedSec / progress) - elapsedSec));
    }

    function formatTime(s) { if (!isFinite(s)) return "--"; return `${Math.floor(s / 60)}m ${Math.floor(s % 60)}s`; }

    document.getElementById('cancelBtn').addEventListener('click', () => {
        isProcessing = false; if (ffmpeg) { try { ffmpeg.terminate(); } catch(e){} ffmpeg = null; }
        resetUI(); showCustomAlert("Stopped", "Compression canceled safely.", "🛑");
    });

    document.getElementById('resetBtn').addEventListener('click', resetUI);

    function resetUI() {
        isProcessing = false; fileQueue = []; currentBatchIndex = 0; 
        ui.fileInput.disabled = false; 
        ui.fileInput.value = ''; ui.fileQueueUI.innerHTML = '';
        ui.fileQueueUI.style.display = 'none'; ui.dashboard.style.display = 'none'; ui.resultPanel.style.display = 'none';
        ui.settingsGrid.style.display = 'none'; ui.startBtn.style.display = 'none'; ui.consoleBody.innerHTML = '';
        ui.uploadZone.style.display = 'flex'; document.getElementById('consoleContainer').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%'; document.getElementById('progressPct').textContent = '0.00%'; document.getElementById('etaDisplay').textContent = '--';
    }
</script>
